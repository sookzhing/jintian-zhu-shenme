<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="今天煮什么">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 72'><g fill='none' stroke='%232F3A2A' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M15 35 Q15 24 25 24 Q29 15 39 18 Q47 12 55 20 Q65 20 65 30 Q66 33 65 35 Z' fill='%23FBF7EC'/><path d='M33 20 Q34 10 43 9 Q44 18 33 20 Z' fill='%238DB86A'/><path d='M9 35 Q40 32 71 35 Q70 63 40 65 Q10 63 9 35 Z' fill='%23EE9A4A'/><path d='M27 48 q3 -3.5 6 0 M47 48 q3 -3.5 6 0 M37 52 q3 3 6 0'/><ellipse cx='24' cy='53' rx='3.6' ry='2.2' fill='%23F2957A' stroke='none'/><ellipse cx='56' cy='53' rx='3.6' ry='2.2' fill='%23F2957A' stroke='none'/></g></svg>">
<title>今天煮什么？</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one kitchen-notebook column — header, two modes (菜单 / 冰箱有什么), shared controls, recipe cards; a recipe opens as a bottom sheet; shopping list at the end */
:root{
  --bg:#F2F4EA; --paper:#FFFEF7; --ink:#2F3A2A; --muted:#6A735F; --line:#D8DDC9;
  --accent:#E0553A; --accent-ink:#FFFFFF; --leaf:#5F8D41; --leaf-soft:#E2EBD2; --chip:#FFFFFF;
  --f-orange:#EE9A4A; --f-yellow:#F2C14E; --f-red:#D9573E; --f-cream:#F3E4C2; --f-green:#8DB86A; --f-pink:#F2957A; --f-brown:#C49468; --f-white:#FBF7EC;
  --shadow:0 1px 0 rgba(60,70,40,.06),0 8px 22px -12px rgba(60,70,40,.35);
  --dot:rgba(95,141,65,.10);
  --display:"ZCOOL KuaiLe","Nunito","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171C15; --paper:#222920; --ink:#E7ECDC; --muted:#A3AC97; --line:#3A4434;
  --accent:#F27A5E; --accent-ink:#1A1310; --leaf:#9CC27A; --leaf-soft:#2D3927; --chip:#262E23;
  --f-orange:#D98B43; --f-yellow:#D9AE45; --f-red:#C9533C; --f-cream:#CDBE9C; --f-green:#7FA75F; --f-pink:#D9846C; --f-brown:#AD845E; --f-white:#D8D2C2;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.7); --dot:rgba(156,194,122,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C15; --paper:#222920; --ink:#E7ECDC; --muted:#A3AC97; --line:#3A4434;
  --accent:#F27A5E; --accent-ink:#1A1310; --leaf:#9CC27A; --leaf-soft:#2D3927; --chip:#262E23;
  --f-orange:#D98B43; --f-yellow:#D9AE45; --f-red:#C9533C; --f-cream:#CDBE9C; --f-green:#7FA75F; --f-pink:#D9846C; --f-brown:#AD845E; --f-white:#D8D2C2;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.7); --dot:rgba(156,194,122,.07); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--leaf);outline-offset:2px}
.press{transition:transform .12s ease}
.press:active{transform:scale(.95)}

header.top{display:flex;align-items:center;gap:14px}
header.top svg{flex:none;width:84px;height:76px}
header.top h1{font-size:clamp(30px,8vw,44px);line-height:1.1}
header.top p{margin:2px 0 0;color:var(--muted);font-size:14px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:10px 14px;text-align:left;box-shadow:var(--shadow);min-height:64px}
.mode svg{flex:none;width:44px;height:40px}
.mode b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.mode[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

.controls{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:800;min-width:44px}
.seg{display:flex;background:var(--leaf-soft);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--leaf)}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--leaf-soft);border-radius:999px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);font-size:20px;font-weight:800;line-height:1}
.stepper output{min-width:62px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf)}

.pick{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.pick .illo{background:var(--leaf-soft);border-radius:18px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center}
.pick .illo svg{width:100%;height:auto}
.pick .eyebrow{font-size:12px;letter-spacing:.1em;font-weight:800;color:var(--accent)}
.pick h2{font-size:26px;line-height:1.25;margin:2px 0 4px}
.pick p{margin:0 0 10px;color:var(--muted)}
.pick .btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--leaf-soft);color:var(--leaf)}
.flip{animation:flip .26s ease}
@keyframes flip{from{transform:perspective(600px) rotateX(14deg) translateY(6px);opacity:.4}to{transform:none;opacity:1}}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:24px}
.sec-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:20px;padding:10px 10px 12px;box-shadow:var(--shadow);min-width:0}
.card .illo{background:var(--leaf-soft);border-radius:14px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center}
.card .illo svg{width:92%;height:auto}
.card h3{font-size:17px;line-height:1.3;padding:0 2px}
.card .meta{font-size:12.5px;color:var(--muted);padding:0 2px;font-variant-numeric:tabular-nums}
.card .need{font-size:12.5px;padding:0 2px;color:var(--accent);font-weight:700}
.card .need.ok{color:var(--leaf)}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 2px}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.tag.pork{background:color-mix(in srgb,var(--f-pink) 25%,transparent);color:var(--accent)}
.tag.sea{background:color-mix(in srgb,var(--f-yellow) 28%,transparent);color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;padding:28px 12px;color:var(--muted);background:var(--paper);border:1.5px dashed var(--line);border-radius:20px}

/* fridge */
.fridge{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.fgroup{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.fgroup svg{width:40px;height:36px}
.fgroup h3{font-size:15px;color:var(--muted);margin:0 0 6px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips .chip{font-size:13.5px;padding:5px 11px;min-height:34px}
.fchips .chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--chip));color:var(--ink)}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px}
.fbar span{color:var(--muted);font-size:13.5px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,25,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s ease}
.overlay.show{opacity:1}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(24px);transition:transform .25s ease}
.overlay.show .sheet{transform:none}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:88vh}}
.sheet-top{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center}
.sheet-top .illo{background:var(--leaf-soft);border-radius:16px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center}
.sheet-top .illo svg{width:100%;height:auto}
.sheet-top h2{font-size:24px;line-height:1.25}
.close{width:44px;height:44px;border-radius:50%;border:0;background:var(--leaf-soft);font-size:22px;align-self:start}
.sheet section{margin-top:18px}
.sheet h3{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet h3 small{font-family:var(--body);font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:800;letter-spacing:.05em;padding:4px 6px;border-bottom:1.5px solid var(--line)}
td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
td.q{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
td.b{color:var(--leaf);font-weight:700}
td.b small{display:block;color:var(--muted);font-weight:400;font-size:12px}
td.have{color:var(--leaf);font-weight:800}
.tbl{overflow-x:auto}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--f-yellow);color:#2F3A2A;display:grid;place-items:center;font-weight:800;font-size:14px}
.tip{background:var(--leaf-soft);border-radius:14px;padding:10px 14px;font-size:14px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

/* shopping */
.shop{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.added{display:flex;flex-wrap:wrap;gap:6px}
.added .chip{display:inline-flex;align-items:center;gap:6px}
.added .chip b{font-weight:800;color:var(--accent)}
.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 16px}
.items li label{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.items input{width:20px;height:20px;accent-color:var(--leaf);flex:none;margin-top:2px}
.items .nm{flex:1;min-width:0}
.items .amt{font-weight:800;color:var(--leaf);white-space:nowrap}
.items input:checked ~ .nm,.items input:checked ~ .amt{text-decoration:line-through;opacity:.5}
.shop h3{font-size:16px;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:14px}
@media (max-width:520px){
  .pick{grid-template-columns:1fr}
  .pick .illo{max-width:260px;width:100%;justify-self:center}
  .sheet-top{grid-template-columns:90px 1fr auto}
  .sheet-top h2{font-size:20px}
  .mode{padding:8px 10px;gap:8px}
  .mode svg{width:34px;height:32px}
  .mode b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <svg viewBox="0 0 80 72" aria-hidden="true" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 12 Q6 8 9 5 M15 10 Q13 6 16 3" stroke="var(--muted)"/>
      <path d="M62 4 L48 30 M70 6 L54 31" stroke="var(--f-brown)" stroke-width="3"/>
      <path d="M15 35 Q15 24 25 24 Q29 15 39 18 Q47 12 55 20 Q65 20 65 30 Q66 33 65 35 Z" fill="var(--f-white)"/>
      <path d="M26 29 l2 1 M36 25 l2 -1 M46 27 l2 1 M55 29 l1 -2" stroke-width="1.6"/>
      <path d="M33 20 Q34 10 43 9 Q44 18 33 20 Z" fill="var(--f-green)"/>
      <path d="M35 18 Q38 14 41 12" stroke-width="1.4"/>
      <path d="M9 35 Q40 32 71 35 Q70 63 40 65 Q10 63 9 35 Z" fill="var(--f-orange)"/>
      <path d="M13 41 Q20 38 26 41 Q33 44 40 41 Q47 38 54 41 Q61 44 67 41" stroke="var(--f-yellow)" stroke-width="2.6"/>
      <path d="M27 48 q3 -3.5 6 0 M47 48 q3 -3.5 6 0"/>
      <path d="M37 52 q3 3 6 0"/>
      <ellipse cx="24" cy="53" rx="3.6" ry="2.2" fill="var(--f-pink)" stroke="none"/>
      <ellipse cx="56" cy="53" rx="3.6" ry="2.2" fill="var(--f-pink)" stroke="none"/>
      <path d="M31 64 L30 69 L50 69 L49 64"/>
    </svg>
    <div>
      <h1>今天煮什么？</h1>
      <p>家里煮的健康餐 · 30 个菜单 · 按人数算好要买多少</p>
    </div>
  </header>

  <div class="modes" role="group" aria-label="选择模式">
    <button class="mode press" data-mode="menu">
      <svg viewBox="0 0 44 40" aria-hidden="true" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 Q22 3 34 5 L35 35 Q22 37 9 35 Z" fill="var(--f-white)"/><path d="M14 12 h14 M14 18 h14 M14 24 h9" stroke="var(--muted)"/><path d="M30 26 l8 -12 l3 2 l-8 12 l-4 1 Z" fill="var(--f-yellow)"/></svg>
      <span><b>看菜单</b><small>30 道健康家常菜</small></span>
    </button>
    <button class="mode press" data-mode="fridge">
      <svg viewBox="0 0 44 40" aria-hidden="true" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="24" height="34" rx="4" fill="var(--f-white)"/><path d="M9 15 h24 M13 8 v4 M13 19 v6"/><circle cx="34" cy="28" r="6" fill="var(--f-red)"/><path d="M34 22 q2 -3 4 -3" stroke="var(--f-green)"/></svg>
      <span><b>冰箱有什么</b><small>用现有食材搭一道</small></span>
    </button>
  </div>

  <div class="controls">
    <div class="row" id="mealRow"><span class="label">餐</span>
      <div class="seg" id="meals" role="group" aria-label="选择餐">
        <button data-m="all" class="press">全部</button>
        <button data-m="b" class="press">早餐</button>
        <button data-m="l" class="press">午餐</button>
        <button data-m="d" class="press">晚餐</button>
      </div>
    </div>
    <div class="row"><span class="label">人数</span>
      <div class="stepper">
        <button id="minus" class="press" aria-label="少一个人">−</button>
        <output id="people" aria-live="polite">2 人</output>
        <button id="plus" class="press" aria-label="多一个人">+</button>
      </div>
    </div>
    <div class="row"><span class="label">筛选</span>
      <button class="chip press" data-f="veg" aria-pressed="false">素食</button>
      <button class="chip press" data-f="nopork" aria-pressed="false">不吃猪肉</button>
      <button class="chip press" data-f="quick" aria-pressed="false">20 分钟内</button>
    </div>
  </div>

  <!-- 菜单模式 -->
  <div id="menuView" style="display:flex;flex-direction:column;gap:22px">
    <div class="pick" id="pick"></div>
    <div class="sec-head"><h2 id="listTitle">菜单</h2><span>点卡片看食材、分量和做法</span></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- 冰箱模式 -->
  <div id="fridgeView" style="display:flex;flex-direction:column;gap:22px" hidden>
    <div class="fridge">
      <div class="sec-head"><h2>冰箱里有什么？</h2><span>点你手上有的食材，调味料不用选</span></div>
      <div id="fgroups" style="display:flex;flex-direction:column;gap:14px"></div>
      <div class="fbar"><span id="fcount">还没选食材</span><button class="btn ghost press" id="fclear">全部取消</button></div>
    </div>
    <div class="pick" id="improv"></div>
    <div class="sec-head"><h2 id="matchTitle">可以煮的菜</h2><span>按缺少的食材排，缺得越少越前面</span></div>
    <div class="grid" id="matches"></div>
  </div>

  <div class="shop" id="shop">
    <div class="sec-head"><h2>购物清单</h2><span id="shopHint"></span></div>
    <div id="shopBody"></div>
  </div>

  <p class="foot">分量是一般成人的家常份量，热量是粗略估算。小朋友算半个人就好。</p>
</div>

<script>
(function(){
// ---------- illustrations (hand-drawn style inline SVG) ----------
var S='fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
var ILLO={
  bowl:function(a,b,c){return '<svg viewBox="0 0 120 90" '+S+' aria-hidden="true">'+
    '<path d="M22 44 Q40 26 60 33 Q80 25 98 44 Z" fill="var('+a+')"/>'+
    '<circle cx="45" cy="37" r="5" fill="var('+b+')"/><circle cx="60" cy="34" r="4.5" fill="var('+c+')"/><circle cx="74" cy="38" r="5" fill="var('+b+')"/>'+
    '<path d="M15 44 Q60 41 105 44 Q102 76 60 79 Q19 76 15 44 Z" fill="var(--paper)"/>'+
    '<path d="M30 55 Q38 58 46 55 M74 58 Q82 60 90 56" stroke="var('+a+')"/>'+
    '<path d="M48 79 L46 84 L74 84 L72 79"/>'+
    '<path d="M80 14 L104 40 M88 10 L110 36" stroke="var(--f-brown)"/></svg>';},
  noodle:function(a,b,c){return '<svg viewBox="0 0 120 90" '+S+' aria-hidden="true">'+
    '<path d="M24 44 Q30 30 40 40 Q48 28 56 40 Q64 28 72 40 Q80 28 88 40 Q94 32 97 44" fill="var('+a+')"/>'+
    '<path d="M50 36 l8 -6 l8 6" fill="var('+b+')"/><ellipse cx="78" cy="38" rx="7" ry="4" fill="var('+c+')"/>'+
    '<path d="M15 44 Q60 41 105 44 Q102 76 60 79 Q19 76 15 44 Z" fill="var(--paper)"/>'+
    '<path d="M38 58 h44" stroke-dasharray="2 6"/><path d="M48 79 L46 84 L74 84 L72 79"/>'+
    '<path d="M70 8 L56 46 M80 9 L64 46" stroke="var(--f-brown)"/></svg>';},

function half(x){var v=Math.ceil(x*2-1e-9)/2;if(v<=0)v=0.5;var i=Math.floor(v);if(v===i)return String(i);return i===0?'半':i+'½';}

  if(q>=1000)return (Math.round(q/100)/10)+' '+(u==='g'?'kg':'L');

}
function buyQty(g,q){

  if(has('燕麦')){

    M.push({use:[PK['燕麦']].concat(add8),name:(add8.length?add8.map(nm).join(''):'')+'燕麦碗',illo:['bowl','--f-cream','--f-yellow','--f-red'],t:10,m:'b',
      steps:['燕麦加'+(D.length?nm(D[0]):'热水')+'（每人约 200ml），小火煮 3 分钟或微波 2 分钟。'].concat(F.length?[F.map(nm).join('、')+'切好铺在上面。']:[],['想甜一点淋少许蜂蜜。']),
      sea:[['蜂蜜',1,'茶匙']]});
  }
  if(F.length&&(D.length||Vraw.length)){
    var use9=F.slice(0,2).concat(D.slice(0,1),Vraw.filter(function(x){return x.name==='菠菜'||x.name==='牛油果';}).slice(0,1));
    M.push({use:use9,name:use9.filter(function(x){return x.type!=='D';}).map(nm).join('')+'奶昔',illo:['cup','--f-green','--f-yellow','--f-white'],t:5,m:'b',
      steps:['把'+use9.map(nm).join('、')+'放进搅拌机'+(D.length?'':'，加一杯清水或冰块')+'，打 40 秒。','倒进杯子马上喝。'],sea:[]});
  }
  if(has('面包 / 卷饼')&&(egg||has('牛油果'))){
    var use10=[PK['面包 / 卷饼']].concat(egg?[egg]:[],has('牛油果')?[PK['牛油果']]:[],has('番茄')?[PK['番茄']]:[]);
    M.push({use:use10,name:use10.slice(1).map(nm).join('')+'吐司',illo:['toast','--f-green','--f-yellow','--f-red'],t:10,m:'b',
      steps:['面包烤到表面微脆。'].concat(egg?['鸡蛋煎成荷包蛋，或水滚后煮 7 分钟切片。']:[],has('牛油果')?['牛油果压成泥，加盐和黑胡椒。']:[],['全部叠在吐司上。']),
      sea:[['盐、黑胡椒',0,'少许']]});
  }
  M.sort(function(a,b){return b.use.length-a.use.length;});
  return M;
}
var KCAL={P:180,V:30,C:220,F:90,D:110};
function toRecipe(m){
  var LBL={'米饭 / 糙米':'糙米或白米（生米）','面包 / 卷饼':'全麦面包','牛奶 / 豆浆':'牛奶或豆浆','面条':'面条（干）'};
  var ing=m.use.map(function(x){return [LBL[x.name]||x.name,x.q,x.u];}).concat(m.sea.map(function(s){return [s[0],s[1],s[2],{s:1}];}));
  var kcal=m.use.reduce(function(a,x){return a+(KCAL[x.type]||0);},m.sea.length?40:0);
  var names=m.use.map(function(x){return x.name;}), diet='vegan';
  if(names.indexOf('猪肉')>=0)diet='pork';else if(/鱼|虾/.test(names.join()))diet='sea';else if(/鸡肉|牛肉/.test(names.join()))diet='meat';else if(/鸡蛋|牛奶|酸奶/.test(names.join()))diet='veg';
  return {id:'x',m:m.m,name:m.name,t:m.t,kcal:Math.round(kcal/10)*10,diet:diet,i:m.illo,note:'用你选的 '+m.use.length+' 样食材即兴搭配',ing:ing,steps:m.steps,
    tip:'这是按你手上的食材搭出来的家常做法，调味可以按口味加减。'};
}

// ---------- render ----------
var $=function(id){return document.getElementById(id);};
function render(){
  document.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===st.mode);});
  document.querySelectorAll('#meals button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===st.meal);});
  document.querySelectorAll('[data-f]').forEach(function(b){b.setAttribute('aria-pressed',!!st.f[b.dataset.f]);});
  $('people').textContent=st.n+' 人';
  $('menuView').hidden=st.mode!=='menu';$('fridgeView').hidden=st.mode!=='fridge';$('mealRow').hidden=st.mode!=='menu';
  if(st.mode==='menu'){
    var L=list();
    $('listTitle').textContent=(st.meal==='all'?'全部菜单':MEAL[st.meal]+'菜单')+' · '+L.length+' 道';
    $('grid').innerHTML=L.length?L.map(function(r){return card(r);}).join(''):'<div class="empty">筛到没有菜了，放宽一点条件试试看。</div>';
    renderPick(false);
  }else renderFridge(false);
  renderShop();
}
function choose(){
  var L=list();if(!L.length){st.pick=null;return;}
  var pool=L.length>1&&st.pick?L.filter(function(r){return r.id!==st.pick;}):L;
  st.pick=pool[Math.floor(Math.random()*pool.length)].id;
}
function renderPick(anim){
  var L=list();
  if(!st.pick||!L.some(function(r){return r.id===st.pick;})){
    if(L.length){var d=new Date();st.pick=L[(d.getDate()+d.getMonth()*31)%L.length].id;}else st.pick=null;
  }
  var el=$('pick');
  if(!st.pick){el.innerHTML='<div class="illo">'+ILLO.bowl('--f-cream','--f-green','--f-yellow')+'</div><div><div class="eyebrow">今天推荐</div><h2>暂时没有合适的菜</h2><p>把筛选放宽一点，就会有推荐了。</p></div>';return;}
  var r=BY[st.pick];
  el.innerHTML='<div class="illo">'+art(r)+'</div><div><div class="eyebrow">今天'+MEAL[r.m]+'就煮这个</div><h2>'+esc(r.name)+'</h2>'+
    '<p>'+esc(r.note)+' · '+r.t+' 分钟 · '+st.n+' 人份</p><div class="btns">'+
    '<button class="btn primary press" data-open="'+r.id+'">看食材和做法</button><button class="btn ghost press" id="reroll">换一道</button></div></div>';
  if(anim){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip');}
}
function renderFridge(anim){
  $('fgroups').innerHTML=GROUPS.map(function(g){
    return '<div class="fgroup"><svg viewBox="0 0 40 38" aria-hidden="true" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+g.icon+'</svg>'+
      '<div><h3>'+g.name+'</h3><div class="fchips">'+g.items.map(function(it){var on=st.fridge.indexOf(it[0])>=0;
        return '<button class="chip press" data-fr="'+esc(it[0])+'" aria-pressed="'+on+'">'+esc(it[0])+'</button>';}).join('')+'</div></div></div>';
  }).join('');
  var n=st.fridge.length;
  $('fcount').textContent=n?'已选 '+n+' 样：'+st.fridge.join('、'):'还没选食材，点上面你手上有的';
  $('fclear').hidden=!n;
  // improvised dish
  var el=$('improv'),M=n?improvise(st.fridge).filter(function(m){return dietOk(toRecipe(m));}):[];
  if(!M.length){
    BY.x=null;
    el.innerHTML='<div class="illo">'+ILLO.pot('--f-cream','--f-green','--f-orange')+'</div><div><div class="eyebrow">即兴料理</div><h2>'+(n?'再多选一两样':'选几样食材试试')+'</h2><p>'+(n?'现在的组合还凑不成一道菜，加一样蛋白质（蛋、豆腐、肉）或蔬菜看看。':'例如选「鸡蛋」「番茄」「米饭」，就能搭出一道炒饭或汤。')+'</p></div>';
  }else{
    var m=M[st.iv%M.length],r=toRecipe(m);BY.x=r;
    el.innerHTML='<div class="illo">'+art(r)+'</div><div><div class="eyebrow">用你现有的食材即兴煮</div><h2>'+esc(r.name)+'</h2>'+
      '<p>用到 '+m.use.map(function(x){return x.name;}).join('、')+' · '+r.t+' 分钟 · '+st.n+' 人份</p><div class="btns">'+
      '<button class="btn primary press" data-open="x">看分量和做法</button>'+(M.length>1?'<button class="btn ghost press" id="nextIdea">换个做法（'+(st.iv%M.length+1)+'/'+M.length+'）</button>':'')+'</div></div>';
    if(anim){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip');}
  }
  // recipes ranked by what's missing
  if(!n){$('matchTitle').textContent='可以煮的菜';$('matches').innerHTML='<div class="empty">选了食材之后，这里会列出用得上的菜单，还会告诉你缺什么。</div>';return;}
  var rows=R.filter(dietOk).map(function(r){var need=needKeys(r),miss=need.filter(function(k){return st.fridge.indexOf(k)<0;});return {r:r,have:need.length-miss.length,miss:miss,need:need.length};})
    .filter(function(x){return x.have>0;})
    .sort(function(a,b){return a.miss.length-b.miss.length||b.have-a.have;});
  var shown=rows.filter(function(x){return x.miss.length<=2;});
  if(!shown.length)shown=rows.slice(0,6);
  $('matchTitle').textContent='可以煮的菜 · '+shown.length+' 道';
  $('matches').innerHTML=shown.length?shown.map(function(x){
    return card(x.r,x.miss.length?'<div class="need">有 '+x.have+'/'+x.need+' 样 · 还缺 '+esc(x.miss.join('、'))+'</div>':'<div class="need ok">食材都齐了，可以直接煮</div>');
  }).join(''):'<div class="empty">菜单里还没有用到这些食材的菜，先看看上面的即兴料理吧。</div>';
}

// ---------- detail sheet ----------
var openId=null,sheetN=2;
function sheetHTML(r){
  var main=r.ing.filter(function(g){return !(g[3]&&g[3].s);}),sea=r.ing.filter(function(g){return g[3]&&g[3].s;});
  var inShop=r.id!=='x'&&st.shop.some(function(x){return x.id===r.id;});
  var showHave=st.mode==='fridge'&&st.fridge.length;
  return '<div class="sheet-top"><div class="illo">'+art(r)+'</div><div><h2 id="sheetTitle">'+esc(r.name)+'</h2><div class="tags" style="padding:4px 0 0">'+tags(r)+
    '<span class="tag">'+r.t+' 分钟</span><span class="tag">约 '+r.kcal+' kcal/人</span></div></div><button class="close press" data-close aria-label="关闭">×</button></div>'+
    '<section><h3>几个人吃？</h3><div class="stepper"><button class="press" data-sn="-1" aria-label="少一个人">−</button><output aria-live="polite">'+sheetN+' 人</output><button class="press" data-sn="1" aria-label="多一个人">+</button></div></section>'+
    '<section><h3>食材 <small>左边是煮的分量，右边是去巴刹 / 超市要买多少</small></h3><div class="tbl"><table><thead><tr><th>食材</th><th>要用</th><th>要买</th></tr></thead><tbody>'+
    main.map(function(g){var k=keyOf(g[0]),got=showHave&&k&&st.fridge.indexOf(k)>=0,b=buyQty(g,g[1]*sheetN);
      return '<tr><td>'+esc(g[0])+'</td><td class="q">'+useQty(g,sheetN)+'</td>'+(got?'<td class="have">家里有</td>':'<td class="b">'+b.a+(b.note?'<small>'+esc(b.note)+'</small>':'')+'</td>')+'</tr>';}).join('')+
    '</tbody></table></div></section>'+
    (sea.length?'<section><h3>调味料 <small>通常家里有，没有再买</small></h3><div class="tbl"><table><tbody>'+
    sea.map(function(g){return '<tr><td>'+esc(g[0])+'</td><td class="q">'+useQty(g,sheetN)+'</td></tr>';}).join('')+'</tbody></table></div></section>':'')+
    '<section><h3>怎么煮</h3><ol class="steps">'+r.steps.map(function(s){return '<li><span>'+esc(s)+'</span></li>';}).join('')+'</ol></section>'+
    '<section><div class="tip"><b>小贴士：</b>'+esc(r.tip)+'</div></section>'+
    (r.id==='x'?'':'<div class="actions"><button class="btn primary press" data-addshop="'+r.id+'">'+(inShop?'更新购物清单（'+sheetN+' 人）':'加入购物清单（'+sheetN+' 人）')+'</button>'+
    (inShop?'<button class="btn ghost press" data-rmshop="'+r.id+'">从清单拿掉</button>':'')+'</div>');
}
var ov=null,lastFocus=null;
function openSheet(id){
  if(!BY[id])return;
  openId=id;var ex=st.shop.filter(function(x){return x.id===id;})[0];sheetN=ex?ex.n:st.n;
  lastFocus=document.activeElement;
  ov=document.createElement('div');ov.className='overlay';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-labelledby','sheetTitle');
  ov.innerHTML='<div class="sheet">'+sheetHTML(BY[id])+'</div>';
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  requestAnimationFrame(function(){ov.classList.add('show');var c=ov.querySelector('.close');c&&c.focus();});
}
function refreshSheet(){if(ov){var s=ov.querySelector('.sheet'),y=s.scrollTop;s.innerHTML=sheetHTML(BY[openId]);s.scrollTop=y;}}
function closeSheet(){if(!ov)return;var o=ov;ov=null;openId=null;o.classList.remove('show');document.body.style.overflow='';setTimeout(function(){o.remove();},230);lastFocus&&lastFocus.focus&&lastFocus.focus();}

// ---------- shopping list ----------
function aggregate(){
  var main={},sea={},order=[],sorder=[];
  st.shop.forEach(function(x){BY[x.id].ing.forEach(function(g){
    var key=g[0]+'|'+g[2],isS=g[3]&&g[3].s,box=isS?sea:main;
    if(!box[key]){box[key]={g:g,q:0};(isS?sorder:order).push(key);}
    box[key].q+=g[1]*x.n;
  });});
  return {main:order.map(function(k){var e=main[k],b=buyQty(e.g,e.q);return {k:k,name:e.g[0],a:b.a,note:b.note};}),
          sea:sorder.map(function(k){return {k:k,name:sea[k].g[0]};})};
}
function renderShop(){
  st.shop=st.shop.filter(function(x){return BY[x.id]&&x.id!=='x';});
  var body=$('shopBody');
  if(!st.shop.length){$('shopHint').textContent='';body.innerHTML='<div class="empty" style="padding:18px">还没加菜。打开任何一道菜，按「加入购物清单」，这里会自动帮你把食材加起来。</div>';return;}
  var A=aggregate(),left=A.main.filter(function(i){return !st.checked[i.k];}).length;
  $('shopHint').textContent='还有 '+left+' 样没买';
  body.innerHTML='<div class="added">'+st.shop.map(function(x){return '<span class="chip">'+esc(BY[x.id].name)+' <b>×'+x.n+'人</b><button class="press" data-rmshop="'+x.id+'" aria-label="拿掉 '+esc(BY[x.id].name)+'" style="border:0;background:none;font-size:16px;padding:0 2px">×</button></span>';}).join('')+'</div>'+
    '<ul class="items">'+A.main.map(function(i,ix){return '<li><label for="it'+ix+'"><input type="checkbox" id="it'+ix+'" data-chk="'+esc(i.k)+'"'+(st.checked[i.k]?' checked':'')+'><span class="nm">'+esc(i.name)+(i.note?'<br><small style="color:var(--muted)">'+esc(i.note)+'</small>':'')+'</span><span class="amt">'+i.a+'</span></label></li>';}).join('')+'</ul>'+
    (A.sea.length?'<h3>调味料，出门前看一下家里有没有</h3><div class="added">'+A.sea.map(function(i){return '<span class="chip">'+esc(i.name)+'</span>';}).join('')+'</div>':'')+
    '<div class="row"><button class="btn primary press" id="copyShop">复制清单</button><button class="btn ghost press" id="clearShop">清空</button></div><textarea id="copyBox" hidden readonly style="width:100%;min-height:120px"></textarea>';
}
function shopText(){var A=aggregate();return '今天煮什么 · 购物清单\n'+A.main.map(function(i){return (st.checked[i.k]?'✓ ':'□ ')+i.name+'：'+i.a;}).join('\n')+(A.sea.length?'\n调味料（看家里有没有）：'+A.sea.map(function(i){return i.name;}).join('、'):'');}
var toastT;function toast(t){var e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';e.setAttribute('role','status');document.body.appendChild(e);}e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true;},1800);}

// ---------- events ----------
var clearArmed=false;
document.addEventListener('click',function(e){
  var t=e.target.closest('button, [data-chk]');
  if(ov&&e.target===ov){closeSheet();return;}
  if(!t)return;
  if(t.dataset.mode){st.mode=t.dataset.mode;save('mode',st.mode);render();return;}
  if(t.dataset.m){st.meal=t.dataset.m;save('meal',st.meal);st.pick=null;render();return;}
  if(t.dataset.f){st.f[t.dataset.f]=!st.f[t.dataset.f];save('f',st.f);render();return;}
  if(t.dataset.fr){var k=t.dataset.fr,i=st.fridge.indexOf(k);if(i>=0)st.fridge.splice(i,1);else st.fridge.push(k);st.iv=0;save('fridge',st.fridge);renderFridge(false);return;}
  if(t.id==='fclear'){st.fridge=[];st.iv=0;save('fridge',st.fridge);renderFridge(false);return;}
  if(t.id==='nextIdea'){st.iv++;renderFridge(true);return;}
  if(t.id==='minus'||t.id==='plus'){st.n=Math.max(1,Math.min(12,st.n+(t.id==='plus'?1:-1)));save('n',st.n);render();return;}
  if(t.id==='reroll'){choose();renderPick(true);return;}
  if(t.dataset.open){openSheet(t.dataset.open);return;}
  if(t.hasAttribute('data-close')){closeSheet();return;}
  if(t.dataset.sn){sheetN=Math.max(1,Math.min(12,sheetN+ +t.dataset.sn));refreshSheet();return;}
  if(t.dataset.addshop){var id=t.dataset.addshop,ex=st.shop.filter(function(x){return x.id===id;})[0];if(ex)ex.n=sheetN;else st.shop.push({id:id,n:sheetN});save('shop',st.shop);renderShop();refreshSheet();toast(ex?'已更新购物清单':'已加入购物清单');return;}
  if(t.dataset.rmshop){st.shop=st.shop.filter(function(x){return x.id!==t.dataset.rmshop;});save('shop',st.shop);renderShop();refreshSheet();toast('已从清单拿掉');return;}
  if(t.id==='copyShop'){var txt=shopText(),box=$('copyBox');
    try{navigator.clipboard.writeText(txt).then(function(){toast('清单已复制，可以贴到 WhatsApp');},function(){box.hidden=false;box.value=txt;box.select();toast('请手动复制下面的文字');});}
    catch(er){box.hidden=false;box.value=txt;box.select();toast('请手动复制下面的文字');}return;}
  if(t.id==='clearShop'){if(!clearArmed){clearArmed=true;t.textContent='再按一次确定清空';setTimeout(function(){clearArmed=false;var b=$('clearShop');if(b)b.textContent='清空';},3000);return;}
    clearArmed=false;st.shop=[];st.checked={};save('shop',st.shop);save('checked',st.checked);renderShop();toast('清单已清空');return;}
});
document.addEventListener('change',function(e){var k=e.target.dataset&&e.target.dataset.chk;if(k){if(e.target.checked)st.checked[k]=1;else delete st.checked[k];save('checked',st.checked);var A=aggregate();$('shopHint').textContent='还有 '+A.main.filter(function(i){return !st.checked[i.k];}).length+' 样没买';}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
render();
})();
</script>

</body>
</html>
